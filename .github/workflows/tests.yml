name: tests
on:
  push:
    branches: ["**"]           # not tags: a release tag is a commit that was already tested
  pull_request:
  schedule:
    - cron: "17 9 * * 1"        # every Monday: catches a new PipeWire/Qt on Arch even when nothing was pushed
  workflow_dispatch:

jobs:
  test:
    name: Ubuntu 24.04 (no audio)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: System libraries for Qt (offscreen) and FFmpeg
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 ffmpeg shellcheck
      - name: Python packages
        run: pip install "PySide6>=6.5" numpy pytest pyflakes opencv-python-headless
      - name: Lint
        run: |
          pyflakes mbox_control.py tests
          shellcheck -S warning install.sh tests/pw_stack.sh
      - name: Tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest -q

  arch:
    name: Arch, current PipeWire (real audio)
    runs-on: ubuntu-24.04
    container: archlinux:latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Packages (what an AUR user has today)
        run: |
          pacman -Syu --noconfirm --needed git python pyside6 python-numpy python-pytest python-pyudev \
            ffmpeg pipewire pipewire-pulse wireplumber libpulse dbus ttf-dejavu
      - uses: actions/checkout@v5
      - name: Versions
        run: |
          pipewire --version
          wireplumber --version
          python -c "import PySide6; print('PySide6', PySide6.__version__)"
      - name: Tests, including real PipeWire playback/recording/EQ
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONFAULTHANDLER: "1"
        run: |
          source tests/pw_stack.sh
          pytest -q -rs
      - name: The real app starts and quits cleanly
        if: always()
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONFAULTHANDLER: "1"
          MBOX_SMOKE_SECONDS: "5"
          MBOX_CARD: "0"
          MBOX_AMIXER: tests/fake_amixer.py
          FAKE_DUMP: tests/fixtures/mbox-pro3-controls.txt
          FAKE_STATE: /tmp/smoke-state.json
          HOME: /tmp/smoke-home
        run: |
          source tests/pw_stack.sh
          mkdir -p "$HOME"
          for run in first second; do         # the second start reads the settings the first one saved
            timeout 60 python mbox_control.py || { echo "::error::$run start/quit failed (exit $?)"; exit 1; }
          done
      - name: PipeWire logs
        if: failure()
        run: tail -n 60 /tmp/mbox-pw.*/*.log || echo "the test PipeWire never started"

  release:
    name: Release (when VERSION went up)
    needs: [test, arch]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: Tag and publish if this version isn't released yet
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ver=$(python3 -c 'import re; print(re.search(r"^VERSION = \"([^\"]+)\"", open("mbox_control.py").read(), re.M)[1])')
          if gh release view "v$ver" >/dev/null 2>&1; then echo "v$ver already released"; exit 0; fi
          python3 tests/tools/changelog_section.py "$ver" > notes.md
          gh release create "v$ver" --target "$GITHUB_SHA" --title "Mbox Control $ver" --notes-file notes.md
          # A ready PKGBUILD for the AUR: version and checksum filled in
          curl -sSfL "https://github.com/$GITHUB_REPOSITORY/archive/refs/tags/v$ver.tar.gz" -o src.tar.gz
          sum=$(sha256sum src.tar.gz | cut -d' ' -f1)
          sed -e "s/^pkgver=.*/pkgver=$ver/" -e "s/^pkgrel=.*/pkgrel=1/" \
              -e "s/^sha256sums=.*/sha256sums=('$sum')/" packaging/aur/PKGBUILD > PKGBUILD
          gh release upload "v$ver" PKGBUILD
